name: Playwright Tests

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run on'
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
          - all
      tag:
        description: 'Test tag to run'
        type: choice
        default: all
        options:
          - all
          - smoke
          - regression
  schedule:
    - cron: '30 7 * * *'

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          BROWSER="${BROWSER_INPUT:-chromium}"
          TAG="${TAG_INPUT:-smoke}"
          ARGS=""
          if [ "$BROWSER" != "all" ]; then
            ARGS="$ARGS --project=$BROWSER"
          fi
          if [ "$TAG" != "all" ]; then
            ARGS="$ARGS --grep @$TAG"
          fi
          echo "Running: npx playwright test $ARGS"
          npx playwright test $ARGS
        continue-on-error: true
        id: run_tests
        env:
          BROWSER_INPUT: ${{ inputs.browser }}
          TAG_INPUT: ${{ inputs.tag }}
          REQRES_LOGIN_URL: ${{ secrets.REQRES_LOGIN_URL }}
          REQRES_EMAIL: ${{ secrets.REQRES_EMAIL }}
          REQRES_PASSWORD: ${{ secrets.REQRES_PASSWORD }}

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Package Allure report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      - name: Fail the job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  smoke-schedule:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests only
        run: npx playwright test --grep "@smoke" --project=chromium
        env:
          REQRES_LOGIN_URL: ${{ secrets.REQRES_LOGIN_URL }}
          REQRES_EMAIL: ${{ secrets.REQRES_EMAIL }}
          REQRES_PASSWORD: ${{ secrets.REQRES_PASSWORD }}

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-report
          path: allure-report/
          retention-days: 14

  deploy-report:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4